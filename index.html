<title>PDF Page Splitter</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Fraunces:opsz,wght@9..144,600&display=swap">
<style>
/* Layout: one centered work column — file bar, mode switch, page sheet grid, sticky action bar. */
:root {
  --bg: #f3f4f7;
  --surface: #ffffff;
  --sunken: #e8eaf0;
  --fg: #1b1f2a;
  --muted: #5c6475;
  --line: #d5d9e2;
  --accent: #2847c9;
  --accent-soft: #dfe5fb;
  --accent-fg: #ffffff;
  --sheet: #ffffff;
  --danger: #b4232f;
  --font-display: "Fraunces", Georgia, "Times New Roman", serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --radius: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151c; --surface: #1a1e28; --sunken: #232836; --fg: #e7e9f0; --muted: #9aa2b4;
    --line: #2f3545; --accent: #7d95ff; --accent-soft: #263055; --accent-fg: #0e1220;
    --sheet: #f4f5f8; --danger: #ff7a84; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151c; --surface: #1a1e28; --sunken: #232836; --fg: #e7e9f0; --muted: #9aa2b4;
  --line: #2f3545; --accent: #7d95ff; --accent-soft: #263055; --accent-fg: #0e1220;
  --sheet: #f4f5f8; --danger: #ff7a84; color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg);
  font: 15px/1.5 var(--font-body);
  padding-inline: 16px; padding-block: 0;
}
.wrap { max-width: 920px; margin: 0 auto; padding-block: 40px 130px; display: grid; gap: 20px; }
header { display: grid; gap: 4px; }
h1 { font: 600 clamp(1.7rem, 4vw, 2.2rem)/1.1 var(--font-display); margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.lede { margin: 0; color: var(--muted); max-width: 60ch; }

.drop {
  border: 1.5px dashed var(--line); border-radius: var(--radius); background: var(--surface);
  padding: 18px; display: flex; flex-wrap: wrap; align-items: center; gap: 14px; justify-content: space-between;
  transition: border-color .15s, background .15s;
}
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.file-meta { display: grid; gap: 2px; min-width: 0; }
.file-name { font-weight: 600; overflow-wrap: anywhere; }
.file-stats { font: 13px var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.badge { display: inline-block; font: 500 11px var(--font-body); letter-spacing: .06em; text-transform: uppercase;
  background: var(--sunken); color: var(--muted); border-radius: 4px; padding: 1px 6px; margin-left: 6px; vertical-align: 2px; }

button, .btn {
  font: 500 14px var(--font-body); border-radius: 6px; border: 1px solid var(--line);
  background: var(--surface); color: var(--fg); padding: 8px 14px; cursor: pointer;
}
@media (hover: hover) { button:hover, .btn:hover { border-color: var(--muted); } }
button:focus-visible, input:focus-visible, .btn:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; padding: 10px 18px; }
button.primary:disabled { opacity: .45; cursor: not-allowed; }
.btn { position: relative; }
.btn input { position: absolute; left: 0; top: 0; width: 1px; height: 1px; opacity: 0; }

.modes { display: inline-flex; background: var(--sunken); border-radius: 8px; padding: 3px; gap: 3px; justify-self: start; }
.modes button { border: 0; background: transparent; color: var(--muted); padding: 7px 14px; }
.modes button[aria-selected="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }

.controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
.field { display: grid; gap: 4px; }
.field label { font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.field input {
  font: 16px var(--font-mono); padding: 8px 10px; /* 16px stops iOS zooming in on focus */ border-radius: 6px; border: 1px solid var(--line);
  background: var(--surface); color: var(--fg); font-variant-numeric: tabular-nums;
}
#pickInput { width: min(340px, 100%); }
.field.grow { flex: 1 1 260px; min-width: 0; }
.field.grow input { width: 100%; }
#fromInput, #toInput { width: 92px; }
.hint { font-size: 13px; color: var(--muted); margin: 0; }
.hint code { font-family: var(--font-mono); background: var(--sunken); padding: 0 4px; border-radius: 3px; }
.err { color: var(--danger); }
.notice { margin: 0; font-size: 14px; padding: 10px 14px; border-radius: 6px; background: var(--accent-soft); color: var(--fg); max-width: 72ch; }
.small-btns { display: flex; gap: 6px; flex-wrap: wrap; }
.small-btns button { padding: 6px 12px; font-size: 13px; }
/* Finger-sized targets on touch screens. */
@media (pointer: coarse) {
  body.typing .bar { display: none; } /* keep the bar from riding on top of the on-screen keyboard */
  button, .btn, .field input { min-height: 44px; }
  .modes button { min-height: 40px; }
  .page { -webkit-tap-highlight-color: transparent; }
}
@media (max-width: 480px) {
  .wrap { padding-block: 24px 130px; gap: 16px; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 12px; }
  .drop .btn { flex: 1 1 100%; text-align: center; }
  .modes { justify-self: stretch; }
  .modes button { flex: 1; }
  .bar .primary { padding-inline: 14px; }
}

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 14px; }
.page {
  position: relative; border: 0; padding: 0; background: none; cursor: pointer; display: grid; gap: 6px;
  justify-items: center; color: var(--muted);
}
.sheet {
  width: 100%; aspect-ratio: 8.5 / 11; background: var(--sheet); border-radius: 3px;
  box-shadow: 0 0 0 1px var(--line), 0 1px 3px rgb(0 0 0 / .08);
  display: grid; place-items: center; overflow: hidden; transition: box-shadow .12s, transform .12s, opacity .12s;
}
.sheet canvas { width: 100%; height: 100%; object-fit: contain; display: block; }
.sheet .num-ph { font: 500 22px var(--font-mono); color: #a7adbb; }
.page .lbl { font: 500 12px var(--font-mono); font-variant-numeric: tabular-nums; }
.page.on .sheet { box-shadow: 0 0 0 3px var(--accent), 0 2px 6px rgb(0 0 0 / .12); }
.page.on .lbl { color: var(--accent); }
.page.on::after {
  content: "✓"; position: absolute; top: 6px; right: 6px; width: 20px; height: 20px; border-radius: 50%;
  background: var(--accent); color: var(--accent-fg); font: 600 12px/20px var(--font-body); text-align: center;
}
.grid.dim .page:not(.on) .sheet { opacity: .45; }
.range-mode .page { cursor: default; }

.bar {
  position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line);
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
}
/* Two fixed lines (summary, status) beside the button, so the bar never grows with long page lists. */
.bar-in { max-width: 920px; margin: 0 auto; display: flex; gap: 12px; align-items: center; justify-content: space-between; }
.status { flex: 1 1 auto; min-width: 0; display: grid; }
.summary, .toast { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.summary { font: 14px var(--font-mono); font-variant-numeric: tabular-nums; }
.summary strong { font-family: var(--font-body); }
.toast { font-size: 13px; color: var(--muted); min-height: 1.5em; }
.bar .primary { flex: none; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <h1>PDF Page Splitter</h1>
    <p class="lede">Keep only the pages you pick, or cut out a page range. Your file never leaves this browser.</p>
  </header>

  <div class="drop" id="drop">
    <div class="file-meta">
      <div class="file-name" id="fileName">Loading sample…</div>
      <div class="file-stats" id="fileStats">&nbsp;</div>
    </div>
    <label class="btn" for="fileInput">Open a PDF…<input type="file" id="fileInput" accept="application/pdf,.pdf"></label>
  </div>

  <div class="modes" role="tablist">
    <button role="tab" id="tabPick" aria-selected="true">Pick pages</button>
    <button role="tab" id="tabRange" aria-selected="false">Page range</button>
  </div>

  <section id="pickPanel" class="controls">
    <div class="field grow">
      <label for="pickInput">Pages to keep</label>
      <input id="pickInput" autocomplete="off" spellcheck="false" placeholder="e.g. 1, 3, 5-7" enterkeyhint="done">
    </div>
    <div class="small-btns">
      <button id="allBtn">All</button>
      <button id="noneBtn">None</button>
      <button id="oddBtn">Odd</button>
      <button id="evenBtn">Even</button>
    </div>
    <p class="hint" style="flex-basis:100%">Select pages below, or type numbers and ranges like <code>1, 3, 5-7</code>.</p>
  </section>

  <section id="rangePanel" class="controls" hidden>
    <div class="field"><label for="fromInput">From page</label><input type="number" id="fromInput" min="1" value="1" inputmode="numeric"></div>
    <div class="field"><label for="toInput">To page</label><input type="number" id="toInput" min="1" value="1" inputmode="numeric"></div>
    <p class="hint" style="flex-basis:100%">Both ends are included.</p>
  </section>

  <p class="hint err" id="errMsg" hidden></p>
  <p class="notice" id="notice" hidden></p>
  <div class="grid" id="grid"></div>
</div>

<div class="bar">
  <div class="bar-in">
    <div class="status">
      <div class="summary" id="summary">—</div>
      <div class="toast" id="toast" aria-live="polite"></div>
    </div>
    <button class="primary" id="saveBtn" disabled>Download PDF</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const state = { bytes: null, name: "", pageCount: 0, mode: "pick", picked: new Set(), from: 1, to: 1 };
let renderDoc = null, observer = null, downloadsP = null;

if (window.pdfjsLib) {
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
}
// Inside a claude.ai artifact, downloads go through the viewer; locally a plain link works.
if (window.claude && window.claude.use) downloadsP = window.claude.use("downloads").catch(() => null);

function fmtSize(n) {
  if (n < 1024) return n + " B";
  if (n < 1048576) return (n / 1024).toFixed(1) + " KB";
  return (n / 1048576).toFixed(1) + " MB";
}

// "1, 3, 5-7" -> sorted unique 1-based page numbers; throws a readable error.
function parsePages(text, max) {
  const out = new Set();
  for (const raw of text.split(",")) {
    const part = raw.trim();
    if (!part) continue;
    const m = part.match(/^(\d+)\s*(?:[-–]\s*(\d+))?$/);
    if (!m) throw new Error(`"${part}" isn't a page number or range.`);
    let a = +m[1], b = m[2] ? +m[2] : a;
    if (a > b) [a, b] = [b, a];
    if (a < 1 || b > max) throw new Error(`Page ${a < 1 ? a : b} is outside 1–${max}.`);
    for (let i = a; i <= b; i++) out.add(i);
  }
  return [...out].sort((x, y) => x - y);
}

// Compact a sorted list back into "1, 3, 5-7".
function formatPages(list) {
  const parts = [];
  for (let i = 0; i < list.length; i++) {
    let j = i;
    while (j + 1 < list.length && list[j + 1] === list[j] + 1) j++;
    parts.push(j > i ? `${list[i]}-${list[j]}` : `${list[i]}`);
    i = j;
  }
  return parts.join(", ");
}

function selectedPages() {
  if (state.mode === "pick") return [...state.picked].sort((a, b) => a - b);
  const { from, to, pageCount } = state;
  if (!(from >= 1 && to >= from && to <= pageCount)) return [];
  return Array.from({ length: to - from + 1 }, (_, i) => from + i);
}

function rangeError() {
  const { from, to, pageCount } = state;
  if (!Number.isInteger(from) || !Number.isInteger(to)) return "Enter whole page numbers.";
  if (from < 1 || to > pageCount) return `Pages must be between 1 and ${pageCount}.`;
  if (from > to) return "“From” must be less than or equal to “To”.";
  return "";
}

function showError(msg) { $("errMsg").textContent = msg; $("errMsg").hidden = !msg; }

function refresh() {
  const pages = new Set(selectedPages());
  document.querySelectorAll(".page").forEach((el) => el.classList.toggle("on", pages.has(+el.dataset.n)));
  $("grid").classList.toggle("dim", pages.size > 0);
  $("grid").classList.toggle("range-mode", state.mode === "range");
  if (state.mode === "range") showError(rangeError());
  const n = pages.size;
  $("summary").innerHTML = n
    ? `<strong>${n} of ${state.pageCount} pages</strong> · ${formatPages([...pages].sort((a, b) => a - b))}`
    : `<strong>No pages selected</strong>`;
  $("summary").title = n ? formatPages([...pages].sort((a, b) => a - b)) : "";
  $("saveBtn").disabled = n === 0;
  if (pending && pending.key !== selKey()) pending = null;
  $("saveBtn").textContent = pending ? "Save to Files" : "Download PDF";
}

// Thumbnails are drawn near the viewport and cleared once they scroll far away,
// so memory stays flat no matter how many pages the file has.
// Phones with little memory (Chrome reports navigator.deviceMemory in GB) get tighter limits.
const LOW_MEMORY = typeof navigator.deviceMemory === "number" && navigator.deviceMemory <= 4;
const THUMB_MAX_PAGES = LOW_MEMORY ? 400 : 1000;
const BIG_FILE = (LOW_MEMORY ? 60 : 200) * 1048576;
let thumbWidth = 220, loadToken = 0;

function buildGrid() {
  const grid = $("grid");
  grid.textContent = "";
  if (observer) observer.disconnect();
  observer = renderDoc && "IntersectionObserver" in window ? new IntersectionObserver(onVisible, { rootMargin: "800px 0px" }) : null;
  const frag = document.createDocumentFragment();
  for (let i = 1; i <= state.pageCount; i++) {
    const b = document.createElement("button");
    b.className = "page"; b.dataset.n = i; b.type = "button";
    b.setAttribute("aria-label", `Page ${i}`);
    b.innerHTML = `<div class="sheet"><span class="num-ph">${i}</span></div><span class="lbl">p. ${i}</span>`;
    frag.appendChild(b);
    if (observer) observer.observe(b);
  }
  grid.appendChild(frag);
}

function onVisible(entries) {
  for (const e of entries) e.isIntersecting ? renderThumb(e.target) : unloadThumb(e.target);
}

async function renderThumb(el) {
  if (!renderDoc || el.dataset.drawn) return;
  const tok = el._tok = (el._tok || 0) + 1;
  const doc = renderDoc;
  try {
    const page = await doc.getPage(+el.dataset.n);
    const base = page.getViewport({ scale: 1 });
    const vp = page.getViewport({ scale: thumbWidth / base.width });
    const c = document.createElement("canvas");
    c.width = Math.round(vp.width); c.height = Math.round(vp.height);
    await page.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
    page.cleanup();
    if (doc !== renderDoc || tok !== el._tok) { c.width = c.height = 0; return; }
    const sheet = el.querySelector(".sheet");
    sheet.style.aspectRatio = `${base.width} / ${base.height}`;
    sheet.textContent = ""; sheet.appendChild(c);
    el.dataset.drawn = "1";
  } catch { /* keep the numbered placeholder */ }
}

function unloadThumb(el) {
  el._tok = (el._tok || 0) + 1; // cancels a render still in flight
  if (!el.dataset.drawn) return;
  const sheet = el.querySelector(".sheet");
  const c = sheet.querySelector("canvas");
  if (c) c.width = c.height = 0; // release the bitmap right away
  sheet.innerHTML = `<span class="num-ph">${el.dataset.n}</span>`;
  delete el.dataset.drawn;
}

function showNotice(msg) { $("notice").textContent = msg; $("notice").hidden = !msg; }

const nextFrame = () => new Promise((r) => requestAnimationFrame(() => setTimeout(r, 0)));

async function loadPdf(bytes, name, isSample) {
  const token = ++loadToken;
  showError(""); showNotice("");
  const size = bytes.byteLength;
  let doc;
  try {
    doc = await PDFLib.PDFDocument.load(bytes);
  } catch (e) {
    if (token !== loadToken) return;
    restoreFileLabel();
    showError(/encrypt/i.test(e && e.message)
      ? `${name} is password-protected or encrypted, so its pages can't be copied. Remove the protection first (for example, open it in a PDF viewer and use Print → Save as PDF), then open the new file here.`
      : `${name} couldn't be read as a PDF. It may be damaged. Try another file.`);
    return;
  }
  if (token !== loadToken) return;
  if (renderDoc) { renderDoc.destroy(); renderDoc = null; }
  state.srcDoc = doc; state.name = name; state.size = size; state.isSample = isSample;
  state.pageCount = doc.getPageCount();
  state.picked = new Set(); state.from = 1; state.to = state.pageCount;
  restoreFileLabel();
  $("pickInput").value = "";
  $("fromInput").value = 1; $("toInput").value = state.pageCount;
  $("fromInput").max = $("toInput").max = state.pageCount;
  if (isSample) { state.picked = new Set([1, 3, 4, 5]); $("pickInput").value = "1, 3-5"; }

  const tooBig = size > BIG_FILE, tooMany = state.pageCount > THUMB_MAX_PAGES;
  thumbWidth = state.pageCount > 300 ? 140 : 220;
  if (tooBig || tooMany) {
    showNotice(`Large file (${tooBig ? fmtSize(size) : state.pageCount + " pages"}). Page previews are off to save memory, and building the new PDF may take a while.`);
  } else if (window.pdfjsLib) {
    // pdf.js takes ownership of the buffer it gets, so hand it a copy.
    try { renderDoc = await pdfjsLib.getDocument({ data: bytes.slice(0) }).promise; } catch { renderDoc = null; }
    if (token !== loadToken) { if (renderDoc) renderDoc.destroy(); return; }
  }
  buildGrid();
  refresh();
}

function restoreFileLabel() {
  if (!state.name) return;
  $("fileName").textContent = state.name;
  if (state.isSample) { const s = document.createElement("span"); s.className = "badge"; s.textContent = "Sample"; $("fileName").append(s); }
  $("fileStats").textContent = `${state.pageCount} pages · ${fmtSize(state.size)}`;
}

async function makeSample() {
  const { PDFDocument, StandardFonts, rgb } = PDFLib;
  const doc = await PDFDocument.create();
  const font = await doc.embedFont(StandardFonts.HelveticaBold);
  const body = await doc.embedFont(StandardFonts.Helvetica);
  const titles = ["Cover", "Contents", "Introduction", "Methods", "Results", "Discussion", "Appendix A", "Appendix B"];
  titles.forEach((t, i) => {
    const p = doc.addPage([612, 792]);
    p.drawRectangle({ x: 0, y: 742, width: 612, height: 50, color: rgb(0.16, 0.28, 0.79) });
    p.drawText(String(i + 1), { x: 60, y: 520, size: 160, font, color: rgb(0.16, 0.28, 0.79) });
    p.drawText(t, { x: 60, y: 450, size: 36, font, color: rgb(0.1, 0.12, 0.16) });
    for (let k = 0; k < 9; k++) p.drawRectangle({ x: 60, y: 380 - k * 28, width: 492 - (k % 3) * 70, height: 8, color: rgb(0.85, 0.87, 0.9) });
    p.drawText(`Sample document · page ${i + 1} of ${titles.length}`, { x: 60, y: 40, size: 10, font: body, color: rgb(0.4, 0.43, 0.5) });
  });
  return new Uint8Array(await doc.save());
}

async function exportPdf() {
  const pages = selectedPages();
  if (!pages.length) return;
  $("saveBtn").disabled = true; $("saveBtn").textContent = "Working…";
  $("toast").textContent = `Building a ${pages.length}-page PDF…`;
  await nextFrame(); // let the "Working…" state paint before the heavy lifting
  try {
    const src = state.srcDoc;
    const out = await PDFLib.PDFDocument.create();
    const copied = await out.copyPages(src, pages.map((n) => n - 1));
    copied.forEach((p) => out.addPage(p));
    const bytes = await out.save();
    const base = state.name.replace(/\.pdf$/i, "");
    const suffix = state.mode === "range" ? `pages-${state.from}-${state.to}` : `pages-${formatPages(pages).replace(/, /g, "_")}`;
    const filename = `${base}_${suffix}.pdf`.slice(0, 200);
    await deliver(filename, bytes);
  } catch (e) {
    $("toast").textContent = "";
    showError(e instanceof RangeError
      ? "This device ran out of memory building the PDF. Select fewer pages, or use a computer."
      : "Couldn't build the PDF: " + (e && e.message ? e.message : e));
  } finally {
    refresh();
  }
}

const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
let pending = null; // a built PDF waiting for a tap on "Save to Files"
const selKey = () => `${loadToken}|${state.mode}|${selectedPages().join(",")}`;

// Returns "done", "needs-tap" (Safari wants a fresh tap after a long build) or "failed".
async function shareFile(file) {
  try {
    await navigator.share({ files: [file] });
    pending = null;
    $("toast").textContent = `Saved ${file.name}`;
    return "done";
  } catch (e) {
    if (e && e.name === "AbortError") { $("toast").textContent = "Save cancelled. Tap Save to Files to try again."; return "done"; }
    if (e && e.name === "NotAllowedError") return "needs-tap";
    return "failed";
  } finally {
    refresh();
  }
}

async function deliver(filename, bytes) {
  const downloads = downloadsP ? await downloadsP : null;
  if (downloads) {
    try {
      await downloads.save({ filename, data: new Blob([bytes], { type: "application/pdf" }) });
      $("toast").textContent = `Saved ${filename}`;
    } catch (e) {
      const code = e && e.code;
      $("toast").textContent = "";
      if (code === "declined") $("toast").textContent = "Download cancelled.";
      else if (code === "rate_limited") $("toast").textContent = "Another save prompt is still open. Finish it, then try again.";
      else if (code === "too_large") showError(`This PDF (${fmtSize(bytes.byteLength)}) is too large for the Claude app to save. Select fewer pages, or open this page in a web browser.`);
      else showError("This view can't save files. Open this page in a web browser.");
    }
    return;
  }
  const blob = new Blob([bytes], { type: "application/pdf" });
  // On iPhone/iPad a link download often just opens the PDF; the share sheet offers "Save to Files".
  if (isIOS && navigator.canShare) {
    const file = new File([blob], filename, { type: "application/pdf" });
    if (navigator.canShare({ files: [file] })) {
      pending = { file, key: selKey() };
      const outcome = await shareFile(file);
      if (outcome === "needs-tap") $("toast").textContent = "Your PDF is ready. Tap Save to Files.";
      if (outcome !== "failed") return;
      pending = null;
    }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  $("toast").textContent = `Downloaded ${filename}`;
}

function setMode(mode) {
  state.mode = mode;
  $("tabPick").setAttribute("aria-selected", mode === "pick");
  $("tabRange").setAttribute("aria-selected", mode === "range");
  $("pickPanel").hidden = mode !== "pick";
  $("rangePanel").hidden = mode !== "range";
  showError("");
  $("toast").textContent = "";
  refresh();
}

function setPicked(list) {
  state.picked = new Set(list);
  $("pickInput").value = formatPages([...state.picked].sort((a, b) => a - b));
  showError("");
  refresh();
}

$("tabPick").onclick = () => setMode("pick");
$("tabRange").onclick = () => setMode("range");

$("grid").addEventListener("click", (e) => {
  const el = e.target.closest(".page");
  if (!el || state.mode !== "pick") return;
  const n = +el.dataset.n;
  const next = new Set(state.picked);
  next.has(n) ? next.delete(n) : next.add(n);
  setPicked([...next]);
});

$("pickInput").addEventListener("input", () => {
  try {
    state.picked = new Set(parsePages($("pickInput").value, state.pageCount));
    showError("");
  } catch (err) { showError(err.message); }
  refresh();
});

const all = () => Array.from({ length: state.pageCount }, (_, i) => i + 1);
$("allBtn").onclick = () => setPicked(all());
$("noneBtn").onclick = () => setPicked([]);
$("oddBtn").onclick = () => setPicked(all().filter((n) => n % 2));
$("evenBtn").onclick = () => setPicked(all().filter((n) => n % 2 === 0));

for (const id of ["fromInput", "toInput"]) {
  $(id).addEventListener("input", () => {
    state.from = parseFloat($("fromInput").value);
    state.to = parseFloat($("toInput").value);
    refresh();
  });
}

$("saveBtn").onclick = () => (pending ? shareFile(pending.file) : exportPdf());

// Track when someone is typing so the bottom bar can step aside for the keyboard.
document.addEventListener("focusin", (e) => {
  if (e.target.matches("input:not([type=file])")) document.body.classList.add("typing");
});
document.addEventListener("focusout", () => document.body.classList.remove("typing"));

let fileRequested = false;
async function openFile(file) {
  if (!file) return;
  fileRequested = true;
  // Android pickers (Drive, chat apps) often hand over files with no .pdf name or MIME type,
  // so check the content: a PDF has "%PDF-" in its first 1024 bytes.
  let head = "";
  try { head = new TextDecoder("latin1").decode(await file.slice(0, 1024).arrayBuffer()); } catch { /* handled below */ }
  if (!head.includes("%PDF-")) { showError(`${file.name} doesn't look like a PDF.`); return; }
  $("toast").textContent = "";
  $("fileName").textContent = `Reading ${file.name}…`;
  $("fileStats").textContent = fmtSize(file.size);
  await nextFrame();
  let bytes;
  try {
    bytes = new Uint8Array(await file.arrayBuffer());
  } catch {
    restoreFileLabel();
    if (!state.name) { $("fileName").textContent = "No file open"; $("fileStats").textContent = "\u00a0"; }
    showError(`${file.name} (${fmtSize(file.size)}) couldn't be loaded. It may be too large for this device's memory, or still downloading from cloud storage.`);
    return;
  }
  await loadPdf(bytes, file.name, false);
}
$("fileInput").addEventListener("change", (e) => { openFile(e.target.files[0]); e.target.value = ""; });

const drop = $("drop");
["dragenter", "dragover"].forEach((t) => document.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach((t) => document.addEventListener(t, (e) => { e.preventDefault(); if (t === "drop" || !e.relatedTarget) drop.classList.remove("over"); }));
document.addEventListener("drop", (e) => openFile(e.dataTransfer.files[0]));

// Installed app only: a PDF opened from the computer ("Open with") or shared from another app.
if ("launchQueue" in window) {
  window.launchQueue.setConsumer(async (params) => {
    if (params.files && params.files.length) openFile(await params.files[0].getFile());
  });
}
async function openSharedFile() {
  if (!new URLSearchParams(location.search).has("shared") || !("caches" in window)) return false;
  history.replaceState(null, "", location.pathname);
  try {
    const cache = await caches.open("pdf-splitter-shared");
    const res = await cache.match("shared-pdf");
    if (!res) return false;
    const name = decodeURIComponent(res.headers.get("X-Filename") || "shared.pdf");
    const blob = await res.blob();
    await cache.delete("shared-pdf");
    await openFile(new File([blob], name, { type: "application/pdf" }));
    return true;
  } catch { return false; }
}

if (window.PDFLib) {
  (async () => {
    if (await openSharedFile()) return;
    const sample = await makeSample();
    if (!fileRequested) loadPdf(sample, "sample-report.pdf", true);
  })();
}
else showError("The PDF library didn't load. Reload the page to try again.");
</script>
